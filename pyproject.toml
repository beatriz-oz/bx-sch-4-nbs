[project]
name = "bx-sch-4-nbs"
version = "0.1.0"
description = "Scheduling system for a nail designer"
readme = "README.md"
authors = [
    { name = "beatriz-oz"}
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncmy>=0.2.14",
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pymysql>=1.2.0",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.3",
]

[project.scripts]
bx-sch-4-nbs = "bx_sch_4_nbs:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.ruff]
line-length = 120
